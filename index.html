<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КМ·Инженер">
<meta name="theme-color" content="#0a84ff">
<meta name="mobile-web-app-capable" content="yes">
<title>КМ·Инженер — АО «Коломенский завод»</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8fc;--card:#fff;--card2:#e9eff7;--card3:#d7e2f0;--sep:rgba(60,90,140,.18);--label:#0c1b33;--label2:rgba(12,27,51,.62);--label3:rgba(12,27,51,.35);--blue:#0a84ff;--blue-l:#5fc9f5;--green:#28b36b;--orange:#ff9f0a;--cyan:#0aa9d6;--purple:#8e6cf0;--red:#ff3b30;--gray:#8fa3bd;--sat:env(safe-area-inset-top,0);--sab:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#02070f;--card:#0b1626;--card2:#12203a;--card3:#1a2f52;--sep:rgba(120,160,220,.16);--label:#eef4fc;--label2:rgba(238,244,252,.6);--label3:rgba(238,244,252,.32);--gray:#6f83a3}}
[data-theme="dark"]{--bg:#02070f;--card:#0b1626;--card2:#12203a;--card3:#1a2f52;--sep:rgba(120,160,220,.16);--label:#eef4fc;--label2:rgba(238,244,252,.6);--label3:rgba(238,244,252,.32);--gray:#6f83a3}
[data-theme="light"]{--bg:#f5f8fc;--card:#fff;--card2:#e9eff7;--card3:#d7e2f0;--sep:rgba(60,90,140,.18);--label:#0c1b33;--label2:rgba(12,27,51,.62);--label3:rgba(12,27,51,.35);--gray:#8fa3bd}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{background:none;border:0;cursor:pointer}
.disp{font-family:"Russo One",sans-serif;font-weight:400}
::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(10,132,255,.5)}100%{box-shadow:0 0 0 26px rgba(10,132,255,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.press{transition:transform .15s}.press:active{transform:scale(.97)}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column}
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#031a3d,#02070f 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:24px}
.splash .logo{width:96px;height:96px;border-radius:26px;background:linear-gradient(150deg,#5fc9f5,#0a84ff);display:grid;place-items:center;font-size:46px;margin-bottom:24px;animation:pop .6s}
.splash h1{font-family:"Russo One";font-size:30px;color:#fff;margin-bottom:8px}
.splash p{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:40px;text-align:center}
.splash .bar{width:240px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-bottom:14px}
.splash .bar i{display:block;height:100%;background:linear-gradient(90deg,#5fc9f5,#0a84ff);width:0;transition:width .3s}
.splash .status{color:rgba(255,255,255,.4);font-size:11px;min-height:14px}
.lock{position:absolute;inset:0;background:linear-gradient(160deg,#031a3d,#02070f 70%);z-index:1100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock .lk-ico{width:70px;height:70px;border-radius:20px;background:linear-gradient(150deg,#5fc9f5,#0a84ff);display:grid;place-items:center;font-size:34px;margin-bottom:20px}
.lock h2{color:#fff;font-family:"Russo One";font-size:22px;margin-bottom:6px}
.lock .sub{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:28px}
.pin-dots{display:flex;gap:16px;margin-bottom:32px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:.2s}
.pin-dots i.on{background:#fff;border-color:#fff}
.pin-dots.err{animation:shake .4s}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pin-pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-weight:600}
.pin-pad button:active{background:rgba(255,255,255,.3)}
.pin-pad button.fn{background:transparent;font-size:13px}
.onboard{position:absolute;inset:0;background:var(--bg);z-index:900;display:flex;flex-direction:column;padding-top:var(--sat)}
.ob-slide{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center}
.ob-slide.on{display:flex;animation:fade .4s}
.ob-ico{width:140px;height:140px;border-radius:40px;display:grid;place-items:center;font-size:70px;margin-bottom:36px}
.ob-ico.b{background:linear-gradient(150deg,#5fc9f5,#0a84ff)}
.ob-ico.g{background:linear-gradient(150deg,#35d07f,#1a8f52)}
.ob-slide h2{font-family:"Russo One";font-size:27px;margin-bottom:14px}
.ob-slide p{color:var(--label2);font-size:16px;line-height:1.5;max-width:340px;margin-bottom:36px}
.ob-dots{display:flex;gap:8px;margin-bottom:20px}
.ob-dots i{width:8px;height:8px;border-radius:50%;background:var(--card3)}
.ob-dots i.on{background:var(--blue);width:24px;border-radius:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;font-size:16px;font-weight:600;min-height:50px}
.btn.b{background:var(--blue);color:#fff}
.btn.card{background:var(--card2);color:var(--label)}
.btn.full{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;min-height:36px;border-radius:11px;width:auto}
.auth{position:absolute;inset:0;background:var(--bg);z-index:800;display:flex;flex-direction:column;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));overflow-y:auto}
.auth h2{font-family:"Russo One";font-size:28px;margin-bottom:6px}
.auth .sub{color:var(--label2);font-size:14px;margin-bottom:28px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--label2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--sep);color:var(--label);padding:13px 15px;border-radius:12px;outline:none;font-size:16px}
.check{display:flex;gap:10px;font-size:13px;color:var(--label2);margin:16px 0;line-height:1.4}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--blue)}
.toggle-mode{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:2px;margin-bottom:22px}
.toggle-mode button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:600;color:var(--label2)}
.toggle-mode button.on{background:var(--blue);color:#fff}
.auth-link{text-align:center;margin-top:18px;font-size:13px;color:var(--label2)}
.auth-link a{color:var(--blue);font-weight:600}
.err{background:rgba(255,59,48,.1);color:var(--red);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.view{flex:1;overflow-y:auto;padding:calc(10px + var(--sat)) 16px calc(92px + var(--sab));display:none}
.view.on{display:block;animation:fade .25s}
.large-title{font-size:34px;font-weight:800;line-height:1.1;padding:calc(14px + var(--sat)) 16px 6px}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.hdr-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.hdr-btn svg{width:20px;height:20px;stroke:var(--label);fill:none;stroke-width:1.8}
.bdot{position:absolute;top:-2px;right:-2px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--bg)}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 8px calc(6px + var(--sab));background:rgba(255,255,255,.85);backdrop-filter:blur(24px);border-top:1px solid var(--sep)}
[data-theme="dark"] .tabbar{background:rgba(6,14,28,.85)}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gray);font-size:10px;font-weight:600;padding:5px 0;position:relative}
.tbtn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{color:var(--blue)}
.tbtn .tb{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--blue);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:14px}
.grow{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative;min-height:48px;text-align:left;width:100%}
.grow+.grow::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--sep)}
.ava{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;position:relative}
.ava.sm{width:32px;height:32px;font-size:11px}
.ava.lg{width:76px;height:76px;font-size:24px}
.ava.b1{background:linear-gradient(150deg,#5fc9f5,#0a84ff)}
.ava.b2{background:linear-gradient(150deg,#0a84ff,#0055d4)}
.ava.b3{background:linear-gradient(150deg,#35d07f,#1a8f52)}
.ava.b4{background:linear-gradient(150deg,#8e6cf0,#5c3fd4)}
.ava.b5{background:linear-gradient(150deg,#0aa9d6,#067a9c)}
.ava.b6{background:linear-gradient(150deg,#ffb84d,#e07a00)}
.ava.gray{background:var(--card3);color:var(--label)}
.pres{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;border:2px solid var(--card)}
.pres.on{background:var(--green)}.pres.away{background:var(--orange)}.pres.off{background:var(--gray)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tg-r{background:rgba(255,59,48,.14);color:var(--red)}.tg-g{background:rgba(40,179,107,.14);color:var(--green)}
.tg-o{background:rgba(255,159,10,.15);color:var(--orange)}.tg-c{background:rgba(10,169,214,.14);color:var(--cyan)}
.tg-b{background:rgba(10,132,255,.14);color:var(--blue)}.tg-p{background:rgba(142,108,240,.14);color:var(--purple)}
.tg-gr{background:rgba(143,163,189,.16);color:var(--gray)}
.seg{display:flex;background:rgba(120,150,190,.16);border-radius:10px;padding:2px;gap:2px;margin-bottom:14px}
.seg button{flex:1;font-size:12.5px;font-weight:600;padding:7px 2px;border-radius:8px;color:var(--label2)}
.seg button.on{background:var(--card);color:var(--blue)}
.tgl{width:51px;height:31px;border-radius:16px;background:rgba(120,140,170,.35);position:relative;transition:.25s;flex:none}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.25s}
.tgl.on{background:var(--blue)}.tgl.on::after{left:22px}
.gtitle{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--label3);padding:20px 8px 8px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.search input{flex:1;background:none;border:0;outline:none;color:var(--label);font-size:16px}
.empty{text-align:center;color:var(--label3);font-size:13px;padding:30px 10px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px}
.stat small{font-size:11px;color:var(--label2);text-transform:uppercase;font-weight:600;display:block;margin-bottom:6px}
.stat b{font-family:"Russo One";font-size:24px}
.stat b em{font-style:normal;font-size:13px;color:var(--label3)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;margin:4px 0 16px;color:#fff;background:linear-gradient(140deg,#5fc9f5,#0a84ff 45%,#0055d4)}
.hero .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.22);padding:5px 10px;border-radius:20px;margin-bottom:10px}
.hero .live i{width:7px;height:7px;border-radius:50%;background:#7dffb0;animation:pulse 1.8s infinite}
.hero h3{font-family:"Russo One";font-size:22px;margin-bottom:6px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.9);max-width:280px;line-height:1.45}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:6px 16px 12px}
.hcard{min-width:160px;background:var(--card);border-radius:16px;padding:14px;flex:none}
.hcard small{font-size:11px;color:var(--label2);text-transform:uppercase;font-weight:600;display:block;margin-bottom:8px}
.hcard .num{font-family:"Russo One";font-size:26px;margin-bottom:10px}
.hcard .num em{font-style:normal;font-size:13px;color:var(--label3)}
.pbar{height:4px;background:var(--card3);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue)}
.pbar i.g{background:var(--green)}.pbar i.o{background:var(--orange)}.pbar i.c{background:var(--cyan)}
.chip{flex:none;font-size:13px;padding:9px 14px;border-radius:20px;background:var(--card);border:1px solid var(--sep);color:var(--label);white-space:nowrap}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.dim{position:absolute;inset:0;background:rgba(2,10,25,.55);z-index:45;opacity:0;pointer-events:none;transition:.3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .4s;max-height:88%;display:flex;flex-direction:column;padding-bottom:calc(14px + var(--sab))}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--card3);margin:8px auto 4px}
.sheet .sh-hd{padding:6px 18px 12px;display:flex;align-items:center;gap:10px}
.sheet .sh-hd h4{font-size:19px;font-weight:800;flex:1}
.sheet .sh-hd button{color:var(--blue);font-size:16px;font-weight:600}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:0 18px 14px}
.page{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(103%);transition:transform .4s}
.page.on{transform:none}
.nav{display:flex;align-items:center;gap:4px;padding:calc(14px + var(--sat)) 10px 10px;background:var(--card);border-bottom:1px solid var(--sep)}
.back{display:flex;align-items:center;color:var(--blue);font-size:16px;font-weight:600;padding:6px 10px}
.back .ch{font-size:24px;line-height:0;margin-right:2px}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sp{width:70px}
.pg-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px calc(24px + var(--sab))}
.msg{padding:14px;border-bottom:1px solid var(--sep);display:flex;gap:12px;align-items:flex-start}
.msg.un{background:rgba(10,132,255,.06)}
.msg .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.msg b{font-size:15px;font-weight:600;display:block;margin-bottom:3px}
.msg small{font-size:13px;color:var(--label2);line-height:1.4;display:block;max-height:36px;overflow:hidden}
.msg .t{margin-left:auto;font-size:11px;color:var(--gray);flex:none;text-align:right}
.msg .ub{background:var(--blue);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;margin-top:4px;margin-left:auto}
.chat-hd{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:16px;margin-bottom:14px}
.chat-hd .ava{width:54px;height:54px;font-size:18px}
.chat-hd b{font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.chat-hd small{font-size:12px;color:var(--label2)}
.chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;flex-direction:column;animation:pop .3s both;position:relative}
.mrow.me{align-items:flex-end}
.bub{max-width:82%;padding:10px 14px;font-size:15px;line-height:1.42;border-radius:19px;word-break:break-word}
.bub.me{background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.them{background:var(--card2);color:var(--label);border-bottom-left-radius:6px}
.bub .tm{display:block;font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.react-add{position:absolute;top:-14px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;font-size:13px;opacity:0;transition:.2s}
.mrow:hover .react-add,.mrow:focus-within .react-add{opacity:1}
.mrow.me .react-add{right:auto;left:8px}
.react-pop{position:absolute;bottom:100%;right:0;background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:2px;padding:6px 8px;z-index:5;margin-bottom:4px}
.react-pop button{font-size:20px;padding:2px 4px}
.react-row{display:flex;gap:4px;margin-top:4px}
.react-chip{background:var(--card2);border-radius:12px;padding:3px 8px;font-size:13px}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(12px + var(--sab));border-top:1px solid var(--sep);background:var(--bg);position:relative}
.chat-input .inp{flex:1;background:var(--card2);border:1px solid var(--sep);color:var(--label);font-size:16px;padding:11px 14px;border-radius:20px;outline:none;max-height:100px;overflow-y:auto;min-height:40px;resize:none}
.chat-input button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.chat-input svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat-input .mic{background:var(--card2)}
.chat-input .mic svg{stroke:var(--label)}
.chat-input .mic.rec{background:var(--red);animation:pulse 1s infinite}
.chat-input .mic.rec svg{stroke:#fff}
.chat-input .send{background:var(--blue)}
.tcard{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.tcard .r1{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tcard .tid{font-family:ui-monospace,monospace;font-size:11px;color:var(--blue);font-weight:600}
.tcard .due{margin-left:auto;font-size:11px;color:var(--gray)}
.tcard .due.late{color:var(--red)}
.tcard b.tt{font-size:15px;font-weight:600;display:block;line-height:1.4;margin-bottom:10px}
.tcard .desc{font-size:13px;color:var(--label2);margin-bottom:12px;line-height:1.4}
.who{display:flex;align-items:center;gap:7px;background:var(--card2);border-radius:20px;padding:3px 11px 3px 3px;font-size:12.5px;font-weight:600}
.who .ava{width:22px;height:22px;font-size:9px}
.stage{display:flex;gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid var(--sep)}
.stage .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.stage .step::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:2px;background:var(--card3)}
.stage .step:first-child::before{display:none}
.stage .step.done::before{background:var(--green)}
.stage .step.on::before{background:var(--orange)}
.stage .step .dot{width:20px;height:20px;border-radius:50%;background:var(--card3);display:grid;place-items:center;font-size:10px;color:#fff;z-index:1;position:relative}
.stage .step.done .dot{background:var(--green)}
.stage .step.on .dot{background:var(--orange)}
.stage .step b{font-size:9.5px;color:var(--label2);text-transform:uppercase}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--sep)}

function doLogin(){

function genPredictions(){
  var preds=[];
  for(var k in state.telemetry){
    var v=state.telemetry[k];
    if(v.status==='warn'){
      preds.push({line:k,name:v.name,prob:clamp(Math.round(v.temp),40,92),reason:'Температура '+v.temp+'°C превышает норму.'});

function runAIChain(trigger){
  var chain={id:uid(),trigger:trigger,steps:[],status:'running',time:now()};

  if(state.aiChains.length>10)state.aiChains.pop();
  saveState();
  var steps=[
    {t:'Обнаружена аномалия',d:trigger},
    {t:'Анализ телеметрии',d:'Сбор данных за 24 ч'},
    {t:'Создана задача',d:'Автоназначение исполнителя'},
    {t:'Уведомлён ответственный',d:'Push + сообщение'},
    {t:'Контроль исполнения',d:'Мониторинг до завершения'}
  ];
  steps.forEach(function(s,i){
    setTimeout(function(){
      chain.steps.push(s);
      if(i===steps.length-1){chain.status='done';showIsland('ИИ: цепочка завершена','⛓','g')}
      saveState();
      if(state.page==='chains')render();
    },(i+1)*700);
  });
}

var pendingSign=null;
function signSheet(title,desc,onSigned){
  pendingSign=onSigned;
  var wrap=h('div',{},h('div',{class:'txt-sm cl-m mb'},desc),h('div',{class:'gtitle'},'✍️ Ваша подпись'));
  var canvas=h('canvas',{width:'600',height:'180',style:{background:'#fff',borderRadius:'12px',width:'100%',height:'180px',touchAction:'none'}});
  wrap.appendChild(canvas);
  wrap.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},
    h('button',{class:'btn card full press',onclick:function(){canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height)}},'Очистить'),
    h('button',{class:'btn b full press',onclick:function(){
      var ctx=canvas.getContext('2d');
      var data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
      var empty=true;
      for(var i=3;i<data.length;i+=4){if(data[i]>0){empty=false;break}}
      if(empty){showIsland('Поставьте подпись','⚠️','o');return}
      hideSheet();
      if(pendingSign)pendingSign();
      showIsland('Подписано ✍️','✅','g');
      vib(30);
    }},'Подписать')
  ));
  showSheet(wrap,title);
  setTimeout(function(){
    var ctx=canvas.getContext('2d');
    ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    var drawing=false,lastX=0,lastY=0;
    function getPos(e){var r=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)}}
    function start(e){e.preventDefault();drawing=true;var p=getPos(e);lastX=p.x;lastY=p.y}
    function move(e){if(!drawing)return;e.preventDefault();var p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y}
    function end(){drawing=false}
    canvas.addEventListener('touchstart',start);canvas.addEventListener('touchmove',move);canvas.addEventListener('touchend',end);
    canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);
  },150);
}

function exportReport(kind){
  var csv='КМ·Инженер — отчёт '+kind+'\nДата: '+fmtDT(now())+'\n\n';
  if(kind==='tasks'){
    csv+='ID;Заголовок;Статус;Приоритет\n';
    state.tasksData.forEach(function(t){csv+=t.id+';'+t.title+';'+t.stage+';'+t.priority+'\n'});
  }else if(kind==='kpi'){
    csv+='Показатель;Значение\nOEE;81.4%\nБрак;1.2%\nПлан;'+state.kpi.planDone+'/'+state.kpi.planTarget+'\n';
  }else{
    csv+='Данные;Значение\nЭкспорт;'+kind+'\n';
  }
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='km_'+kind+'.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){a.remove()},500);
  showIsland('Отчёт выгружен 📊','📊','g');
  vib(30);
}

  if(!state.calMonth){var d=now();state.calMonth={y:d.getFullYear(),m:d.getMonth()}}

  body.appendChild(h('div',{class:'cal-head'},
    h('button',{class:'press',onclick:function(){cm.m--;if(cm.m<0){cm.m=11;cm.y--}saveState();render()}},'‹'),

  ));
  var grid=h('div',{class:'cal-grid'});
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(d){grid.appendChild(h('div',{class:'cal-dow'},d))});
  var first=new Date(cm.y,cm.m,1);
  var startDow=(first.getDay()+6)%7;
  var daysInMonth=new Date(cm.y,cm.m+1,0).getDate();
  var prevDays=new Date(cm.y,cm.m,0).getDate();
  var today=now();
  for(var i=0;i<startDow;i++)grid.appendChild(h('div',{class:'cal-day other'},String(prevDays-startDow+1+i)));
  for(var dd=1;dd<=daysInMonth;dd++){
    (function(day){
      var isToday=day===today.getDate()&&cm.m===today.getMonth()&&cm.y===today.getFullYear();
      var isSel=state.calSel&&state.calSel.d===day&&state.calSel.m===cm.m&&state.calSel.y===cm.y;
      grid.appendChild(h('button',{class:'cal-day'+(isToday?' today':'')+(isSel?' sel':''),onclick:function(){state.calSel={d:day,m:cm.m,y:cm.y};saveState();render()}},String(day)));
    })(dd);
  }
  body.appendChild(grid);
  body.appendChild(h('div',{class:'gtitle'},'События'));
  var evs=[{ico:'🏭',t:'Рабочая смена 08:00–20:00',s:'Цех №3'}];
  if(state.calSel){
    state.tasksData.forEach(function(t){
      var tdd=new Date(t.due);
      if(tdd.getDate()===state.calSel.d&&tdd.getMonth()===state.calSel.m)evs.push({ico:'📋',t:'Дедлайн: '+t.title,s:t.id});
    });
  }else evs.push({ico:'💡',t:'Выберите день',s:'чтобы увидеть события'});
  evs.forEach(function(ev){
    body.appendChild(h('div',{class:'card',style:{padding:'12px',display:'flex',gap:'10px',alignItems:'center'}},
      h('div',{style:{fontSize:'20px'}},ev.ico),
      h('div',{},h('b',{style:{fontSize:'14px'}},ev.t),h('small',{class:'cl-m',style:{display:'block'}},ev.s))
    ));
  });
  pg.appendChild(body);
  container.appendChild(pg);
}

function buildSpark(data){
  if(!data||data.length===0)return[];
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),range=(max-min)||1;
  var pts=data.map(function(v,i){return[(i/(data.length-1))*120,30-((v-min)/range)*26-2]});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  return[h('polyline',{points:line,fill:'none',stroke:'#0a84ff','stroke-width':'1.5'})];
}

function renderAIMessages(container){
  container.innerHTML='';
  aiMessages.forEach(function(m){
    var row=h('div',{class:'mrow'+(m.from==='ai'?'':' me')});
    var bub=h('div',{class:'bub'+(m.from==='ai'?' them':' me')});
    if(m.from==='ai'){
      if(m.trace){
        var tr=h('details',{class:'trace'},h('summary',{},'⛓ Пайплайн ('+m.trace.length+' шагов)'));
        var steps=h('div',{style:{padding:'8px 11px',fontSize:'11px',fontFamily:'ui-monospace,monospace',color:'var(--label3)'}});
        m.trace.forEach(function(s){steps.appendChild(h('div',{},s))});
        tr.appendChild(steps);
        bub.appendChild(tr);
      }
      if(m.html){var wrap=h('div',{});wrap.innerHTML=m.html;bub.appendChild(wrap)}
      else if(m.text)bub.appendChild(h('div',{style:{whiteSpace:'pre-wrap'}},m.text));
    }else{
      bub.appendChild(h('span',{},m.text));
    }
    bub.appendChild(h('span',{class:'tm'},fmtTime(m.time)));
    row.appendChild(bub);
    container.appendChild(row);
  });
}
function sendAI(text){
  var inp=$('[data-id="aiInput"]');
  if(inp&&!text){text=inp.value.trim();if(!text)return;inp.value=''}
  if(!text)return;
  aiMessages.push({id:uid(),from:'user',time:now(),text:text});
  aiLearn();
  saveState();
  renderAIMessages($('#aiMsgs'));
  var typing=h('div',{class:'mrow'});
  typing.appendChild(h('div',{class:'bub them'},'● ● ●'));
  var m=$('#aiMsgs');
  if(m){m.appendChild(typing);m.scrollTop=m.scrollHeight}
  setTimeout(function(){
    typing.remove();
    var response=aiProcess(text);
    aiMessages.push({id:uid(),from:'ai',time:now(),text:response.text,html:response.html,trace:response.trace});
    saveState();
    renderAIMessages($('#aiMsgs'));
    var m2=$('#aiMsgs');
    if(m2)m2.scrollTop=m2.scrollHeight;
    vib(15);
  },800);
}
function aiProcess(query){
  var q=query.toLowerCase(),trace=[],result={text:null,html:null,trace:null};
  trace.push('ORCH → intent='+classifyIntent(q));
  trace.push('MEM → память: '+state.aiMem.facts.length+' фактов · '+state.aiMem.xp+' XP');
  trace.push('RAG → поиск в базе знаний');
  trace.push('TOOL → выбор инструмента');
  trace.push('LLM → генерация ответа');
  result.trace=trace;
  var intent=classifyIntent(q);
  if(intent==='memory'){
    var nameMatch=query.match(/меня зовут\s+([а-яА-ЯёЁ]+)/i);
    if(nameMatch){state.aiMem.name=nameMatch[1];saveState();result.html='<b style="color:var(--green)">✓ Запомнил</b><br>Теперь я знаю, что вас зовут <b>'+state.aiMem.name+'</b>.';return result}
    var factMatch=query.match(/запомни[:,]?\s+(.+)/i);
    if(factMatch){state.aiMem.facts.push(factMatch[1]);if(state.aiMem.facts.length>20)state.aiMem.facts.shift();saveState();result.html='<b style="color:var(--green)">✓ Записал в память</b><br>«'+factMatch[1]+'» — запомнено.';return result}
    if(q.indexOf('что ты знаешь')>=0||q.indexOf('память')>=0){
      var facts=state.aiMem.facts.length>0?'<ul style="margin:6px 0 0 18px">'+state.aiMem.facts.map(function(f){return'<li>'+f+'</li>'}).join('')+'</ul>':'<p style="opacity:.6">Пока нет сохранённых фактов. Скажите: «запомни, что...»</p>';
      result.html='<b>🧠 Моя память</b><br>Имя: <b>'+(state.aiMem.name||'не задано')+'</b><br>Фактов: <b>'+state.aiMem.facts.length+'</b><br>Запросов: <b>'+state.aiMem.queries+'</b>'+facts;
      return result;
    }
    result.html='Я умею запоминать. Скажите: «меня зовут ...» или «запомни, что ...».';
    return result;
  }
  if(intent==='predict'){
    genPredictions();
    setTimeout(function(){state.page='predict';saveState();render()},700);
    var top=DATA.predictions[0];
    result.html='<b>📈 Предиктивная аналитика</b><br>'+(top?('Наибольший риск: <b>'+top.line+'</b> — вероятность '+top.prob+'%. '+top.reason):'Все системы в норме.')+'<br>Открываю полный прогноз…';
    return result;
  }
  if(intent==='chain'){
    runAIChain('Запрошено пользователем: полная диагностика');
    setTimeout(function(){state.page='chains';saveState();render()},700);
    result.html='<b>⛓ Запускаю автономную цепочку</b><br>ИИ выполнит: обнаружение аномалий → анализ → создание задач → уведомления → контроль. Открываю журнал…';
    return result;
  }
  if(intent==='call'){
    var match=findEmployeeInQuery(query);
    if(match){
      setTimeout(function(){startCall(match)},600);
      result.html='<b>📞 Звоню внутри приложения…</b><br>'+match.name+'<br>'+match.pos;
      return result;
    }
    result.html='Уточните, кому позвонить. Например: «Позвони Беляеву».';
    return result;
  }
  if(intent==='digest'){
    var myOpen=state.tasksData.filter(function(t){return t.executor===state.user.id&&t.stage!=='done'}).length;
    result.html='<b>📋 Ваш дайджест</b><br>Активных задач: <b>'+myOpen+'</b><br>Непрочитанных: <b>'+countUnread()+'</b><br>Прогнозов ИИ: <b>'+DATA.predictions.length+'</b>';
    return result;
  }
  if(intent==='product'){
    var p=DATA.products.find(function(p){return q.indexOf(p.name.toLowerCase())>=0});
    if(p){
      setTimeout(function(){openFormula(p.id)},1200);
      result.html='<b>⚙️ '+p.name+'</b><br>'+p.desc+'<br>Открываю формуляр изделия…';
      return result;
    }
    result.html='В линейке: Д49, ТЭМ18ДМ, 2ТЭ25КМ.';
    return result;
  }
  if(intent==='knowledge'){
    var ragMatches=DATA.knowledgeBase.filter(function(kb){return q.split(/\s+/).some(function(kw){return kw.length>=3&&(kb.title.toLowerCase().indexOf(kw)>=0||kb.text.toLowerCase().indexOf(kw)>=0)})});
    if(ragMatches.length>0){
      var main=ragMatches[0];
      result.html='<b>📖 '+main.title+'</b><br>'+main.text+'<br><small style="opacity:.6">Источник: '+main.src+'</small>';
      return result;
    }
    result.html='В базе знаний нет точного ответа. Уточните изделие (Д49, ТЭМ18ДМ, 2ТЭ25КМ).';
    return result;
  }
  result.html='Я понял запрос. Умею:<br>• 📈 предсказывать поломки<br>• ⛓ запускать автономные цепочки<br>• 📞 звонить коллегам<br>• 🧠 запоминать<br>• 📖 отвечать по регламентам';
  return result;
}
function classifyIntent(q){
  if(/(меня зовут|запомни|что ты знаешь|память)/.test(q))return'memory';
  else if(/(прогноз|предскаж|предиктив|поломк|отказ)/.test(q))return'predict';
  else if(/(цепочк|автоном|запусти)/.test(q))return'chain';
  else if(/(позвони|набери|звонок)/.test(q))return'call';
  else if(/(сводк|дайджест|как дел)/.test(q))return'digest';
  else if(/(регламент|инструкц|ТО|замен|неисправн)/.test(q))return'knowledge';
  else if(/(д49|тэм18|2тэ25|издели|формуляр)/.test(q))return'product';
  return'general';
}
function findEmployeeInQuery(q){
  q=q.toLowerCase();
  for(var i=0;i<DATA.employees.length;i++){
    var e=DATA.employees[i];
    var parts=e.name.toLowerCase().split(/\s+/);
    for(var j=0;j<parts.length;j++){if(parts[j].length>3&&q.indexOf(parts[j])>=0)return e}
    if(q.indexOf(e.badge)>=0||q.indexOf(e.pos.toLowerCase())>=0)return e;
  }
  return null;
}

function showSheet(content,title){
  var existing=$('#sheetOverlay');
  if(existing)existing.remove();
  var overlay=h('div',{id:'sheetOverlay',class:'dim on',onclick:function(e){if(e.target===overlay)hideSheet()}});
  var sheet=h('div',{class:'sheet on',id:'sheet'},
    h('div',{class:'grab'}),
    title?h('div',{class:'sh-hd'},h('h4',{},title),h('button',{class:'press',onclick:hideSheet},'Готово')):null,
    h('div',{class:'sh-body'},content)
  );
  var startY=0,curY=0,dragging=false;
  sheet.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;dragging=true});
  sheet.addEventListener('touchmove',function(e){if(!dragging)return;curY=e.touches[0].clientY-startY;if(curY>0)sheet.style.transform='translateY('+curY+'px)'});
  sheet.addEventListener('touchend',function(){if(curY>100)hideSheet();else sheet.style.transform='';dragging=false;curY=0});
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}
function hideSheet(){
  var o=$('#sheetOverlay');
  if(!o)return;
  var s=$('#sheet');
  if(s)s.style.transform='translateY(105%)';
  o.classList.remove('on');
  setTimeout(function(){o.remove()},420);
}

    h('button',{class:'hdr-btn press',onclick:function(){state.user=null;saveState();render()}},h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9'})))
  ));
  view.appendChild(h('div',{class:'hero'},
    h('div',{class:'live'},h('i'),'КАБИНЕТ ПОСТАВЩИКА'),
    h('h3',{},state.user.name),
    h('p',{},'Поставки и уведомления заводу')
  ));
  view.appendChild(h('div',{class:'stat-row'},
    h('div',{class:'stat'},h('small',{},'Активных поставок'),h('b',{},'3')),
    h('div',{class:'stat'},h('small',{},'В пути'),h('b',{},'1'))
  ));
  view.appendChild(h('div',{class:'gtitle'},'Текущие поставки'));
  [{id:'П-2001',product:'Металлопрокат 40Х',qty:'45 т',status:'В пути'},
   {id:'П-2002',product:'Лист стальной 8мм',qty:'12 т',status:'Готов к отгрузке'},
   {id:'П-2003',product:'Труба профильная',qty:'380 п.м.',status:'Доставлено'}
  ].forEach(function(p){
    view.appendChild(h('div',{class:'card',style:{padding:'16px'}},
      h('div',{class:'row between mb'},h('span',{class:'mon txt-sm cl-b bld'},p.id),h('span',{class:'tag '+(p.status==='Доставлено'?'tg-g':p.status==='В пути'?'tg-o':'tg-b')},p.status)),
      h('b',{},p.product),
      h('div',{class:'txt-sm cl-m mt'},'Объём: '+p.qty),
      h('div',{class:'row mt',style:{gap:'8px'}},
        h('button',{class:'btn sm card press',onclick:function(){p.status='В пути';render();showIsland('Отмечено: в пути','🚚','o')}},'🚚 Отгрузить'),
        h('button',{class:'btn sm card press',onclick:function(){p.status='Доставлено';render();showIsland('Отмечено: доставлено','✅','g')}},'✅ Доставлено')
      )
    ));
  });
  view.appendChild(h('button',{class:'btn b full press mt',onclick:function(){showIsland('Уведомление отправлено','📨','g')}},'📨 Отправить уведомление заводу'));
  main.appendChild(view);
  app.appendChild(main);
}
// ===== INIT =====
function init(){
  applyTheme();
  genPredictions();
  render();
  if(state.user&&state.user.role!=='supplier'){
    startAutonomy();
  }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}
else{init()}
}catch(fatalErr){
  showError('Критическая ошибка при запуске: '+fatalErr.message, fatalErr.stack);
}
})();
</script>
